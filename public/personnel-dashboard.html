<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Espace Personnel - CS JOBEC</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --primary-blue: #002147; --gold: #D4AF37; --dark: #1a1a1a; --success: #28a745; }
        body { 
            font-family: 'Poppins', sans-serif; 
            background: #f4f4f9; 
            margin: 0; 
            padding: 20px; 
            display: flex;
            justify-content: center;
            align-items: center;
            height: 90vh;
        }
        .container { max-width: 450px; width: 100%; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); text-align: center; }
        h2 { color: var(--primary-blue); margin-bottom: 5px; }
        p.subtitle { color: #666; font-size: 0.9rem; margin-bottom: 25px; }
        .input-group { display: flex; gap: 10px; margin-bottom: 20px; }
        input { flex: 1; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 1rem; outline: none; }
        button { background: var(--primary-blue); color: white; border: none; padding: 12px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        button:hover { background: #001530; }
        .card-result { margin-top: 20px; padding: 20px; border-radius: 8px; text-align: left; display: none; }
        .present { background: #d1fae5; border: 1px solid #10b981; color: #065f46; }
        .absent { background: #fee2e2; border: 1px solid #ef4444; color: #991b1b; }
    </style>
</head>
<body>

<div class="card">
    <h2>👥 Suivi des Présences du Personnel</h2>
    <table>
        <thead>
            <tr>
                <th>Noms & Prénom</th>
                <th>Fonction</th>
                <th>Téléphone</th>
                <th>Date</th>
                <th>Arrivée</th>
                <th>Départ</th>
            </tr>
        <th id="tableauPersonnel">
            <!-- Les données s'afficheront ici automatiquement -->
        </th>
    </table>
</div>

<script>
    async function chargerPresencesPersonnel() {
        try {
            const response = await fetch('/api/admin/presences-personnel');
            const result = await response.json();
            
            if (result.success) {
                const tbody = document.getElementById('tableauPersonnel');
                tbody.innerHTML = '';
                
                result.data.forEach(p => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${p.nom} ${p.prenom}</td>
                        <td>${p.fonction}</td>
                        <td>${p.telephone}</td>
                        <td>${new Date(p.date_jour).toLocaleDateString('fr-FR')}</td>
                        <td><span style="color: green; font-weight: bold;">${p.heure_arrivee || '--:--'}</span></td>
                        <td><span style="color: red; font-weight: bold;">${p.heure_depart || 'En service'}</span></td>
                    `;
                    tbody.appendChild(tr);
                });
            }
        } catch (err) {
            console.error("Erreur de chargement", err);
        }
    }

    // Charger au démarrage de la page
    chargerPresencesPersonnel();
</script>

</body>
</html>
