<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Espace Personnel - CS JOBEC</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --primary-blue: #002147; --gold: #D4AF37; --dark: #1a1a1a; --success: #28a745; }
        body { 
            font-family: 'Poppins', sans-serif; 
            background: #f4f4f9; 
            margin: 0; 
            padding: 20px; 
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 90vh;
        }
        .container { max-width: 800px; width: 100%; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        h2 { color: var(--primary-blue); margin-bottom: 15px; text-align: center; }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: var(--primary-blue);
            color: white;
        }
        tr:hover {
            background-color: #f1f1f1;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>👥 Suivi des Présences du Personnel</h2>
    <table>
        <thead>
            <tr>
                <th>Noms & Prénom</th>
                <th>Fonction</th>
                <th>Téléphone</th>
                <th>Date</th>
                <th>Arrivée</th>
                <th>Départ</th>
            </tr>
        </thead>
        <tbody id="tableauPersonnel">
            <!-- Les données s'afficheront ici automatiquement -->
        </tbody>
    </table>
</div>

<script>
    async function chargerPresencesPersonnel() {
        try {
            const response = await fetch('/api/admin/presences-personnel');
            
            // Vérification si le serveur renvoie bien du JSON (et non une page HTML 404)
            const contentType = response.headers.get("content-type");
            if (!contentType || !contentType.includes("application/json")) {
                throw new Error("Le serveur n'a pas renvoyé du JSON (route introuvable ou erreur serveur).");
            }

            const result = await response.json();
            
            if (result.success) {
                const tbody = document.getElementById('tableauPersonnel');
                tbody.innerHTML = '';
                
                if (result.data.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: #666;">Aucune présence enregistrée pour le moment.</td></tr>`;
                    return;
                }

                result.data.forEach(p => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${p.nom || ''} ${p.prenom || ''}</td>
                        <td>${p.fonction || ''}</td>
                        <td>${p.telephone || ''}</td>
                        <td>${p.date_jour ? new Date(p.date_jour).toLocaleDateString('fr-FR') : ''}</td>
                        <td><span style="color: green; font-weight: bold;">${p.heure_arrivee || '--:--'}</span></td>
                        <td><span style="color: red; font-weight: bold;">${p.heure_depart || 'En service'}</span></td>
                    `;
                    tbody.appendChild(tr);
                });
            } else {
                console.error("Erreur renvoyée par l'API :", result.message);
            }
        } catch (err) {
            console.error("Erreur de chargement des présences :", err);
        }
    }

    // Charger au démarrage de la page
    chargerPresencesPersonnel();
</script>

</body>
</html>
