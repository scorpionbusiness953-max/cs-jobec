<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Espace Administration - Saisie des Notes</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #cbd5e1;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 600px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: var(--primary-hover);
            text-decoration: underline;
        }

        h2 {
            margin-top: 0;
            margin-bottom: 25px;
            font-size: 1.5rem;
            color: var(--text-color);
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 10px;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        label {
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: -5px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            background-color: #fff;
            box-sizing: border-box;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        button[type="submit"] {
            margin-top: 10px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 14px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        button[type="submit"]:hover {
            background-color: var(--primary-hover);
        }

        button[type="submit"]:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-link">← Retour au site officiel</a>
        <h2>Espace Administration - Saisie des Notes</h2>
        
        <form id="formNote" onsubmit="enregistrerNote(event)">
            <label for="matriculeEleve">Matricule de l'élève :</label>
            <input type="text" id="matriculeEleve" placeholder="Ex: JOBEC2026001" required>

            <label for="trimestreSelect">Trimestre :</label>
            <select id="trimestreSelect" required>
                <option value="Trimestre 1">Trimestre 1</option>
                <option value="Trimestre 2">Trimestre 2</option>
                <option value="Trimestre 3">Trimestre 3</option>
            </select>

            <label for="matiereInput">Matière :</label>
            <input type="text" id="matiereInput" placeholder="Ex: Mathématiques" required>

            <label for="typeEval">Type d'évaluation :</label>
            <select id="typeEval" required>
                <option value="Interrogation">Interrogation</option>
                <option value="Devoir">Devoir</option>
                <option value="Examen">Examen</option>
            </select>

            <label for="noteObtenue">Note obtenue :</label>
            <input type="number" step="0.1" id="noteObtenue" placeholder="Ex: 15.5" required>

            <label for="sur">Noté sur (Barème) :</label>
            <input type="number" step="0.1" id="sur" value="20" required>

            <label for="coefficientInput">Coefficient :</label>
            <input type="number" id="coefficientInput" value="1" required>

            <button type="submit">Enregistrer la Note</button>
        </form>
    </div>

    <script>
        async function enregistrerNote(event) {
            event.preventDefault();

            const data = {
                matricule: document.getElementById('matriculeEleve').value,
                trimestre: document.getElementById('trimestreSelect').value,
                matiere: document.getElementById('matiereInput').value, // Correction ici
                type_evaluation: document.getElementById('typeEval').value,
                sur: parseFloat(document.getElementById('sur').value),
                note: parseFloat(document.getElementById('noteObtenue').value),
                coefficient: parseInt(document.getElementById('coefficientInput').value)
            };

            try {
                const response = await fetch('/api/ajouter-note', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await response.json();
                if (result.success) {
                    alert("Note enregistrée avec succès !");
                    document.getElementById('formNote').reset();
                } else {
                    alert("Erreur : " + result.error);
                }
            } catch (error) {
                console.error("Erreur réseau:", error);
                alert("Impossible de contacter le serveur.");
            }
        }
    </script>
</body>
</html>
