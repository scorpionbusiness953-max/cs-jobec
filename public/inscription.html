<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Inscription en Ligne - CS Jobec</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; margin: 0; padding: 20px; }
        .container { max-width: 800px; background: white; padding: 30px; margin: auto; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h2 { color: #333; text-align: center; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input, select { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { background: #28a745; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; width: 100%; font-size: 16px; }
        button:hover { background: #218838; }
        .row { display: flex; gap: 15px; }
        .col { flex: 1; }
    </style>
</head>
<body>

<div class="container">
    <a href="index.html" class="back-link">← Retour au site officiel</a>
    <h2>Formulaire d'Inscription en Ligne - CS Jobec</h2>
    <form id="formInscription">
        <h3>Informations de l'Élève</h3>
        <div class="row">
            <div class="col"><div class="form-group"><label>Nom :</label><input type="text" id="nom" required></div></div>
            <div class="col"><div class="form-group"><label>Post-nom :</label><input type="text" id="postnom"></div></div>
            <div class="col"><div class="form-group"><label>Prénom :</label><input type="text" id="prenom" required></div></div>
        </div>

        <div class="row">
            <div class="col">
                <div class="form-group">
                    <label>Cycle :</label>
                    <select id="cycle">
                        <option value="Maternel">Maternel</option>
                        <option value="Primaire">Primaire</option>
                        <option value="Humanités">Humanités</option>
                    </select>
                </div>
            </div>
            <div class="col"><div class="form-group"><label>Classe :</label><input type="text" id="classe" placeholder="ex: 3EME"></div></div>
            <div class="col">
                <div class="form-group">
                    <label>Genre :</label>
                    <select id="genre"><option value="M">Masculin</option><option value="F">Féminin</option></select>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col"><div class="form-group"><label>Date de Naissance :</label><input type="date" id="date_naissance"></div></div>
            <div class="col"><div class="form-group"><label>Nationalité :</label><input type="text" id="nationalite" value="Congolaise"></div></div>
        </div>

        <h3>Coordonnées & Adresse</h3>
        <div class="row">
            <div class="col"><div class="form-group"><label>Province :</label><input type="text" id="province" value="Kinshasa"></div></div>
            <div class="col"><div class="form-group"><label>Commune :</label><input type="text" id="commune"></div></div>
            <div class="col"><div class="form-group"><label>Quartier :</label><input type="text" id="quartier"></div></div>
        </div>
        <div class="form-group"><label>Adresse Physique :</label><input type="text" id="adresse_physique"></div>
        <div class="form-group"><label>Email :</label><input type="email" id="email"></div>

        <h3>Parents & Responsables</h3>
        <div class="row">
            <div class="col"><div class="form-group"><label>Nom du Père :</label><input type="text" id="pere"></div></div>
            <div class="col"><div class="form-group"><label>Profession du Père :</label><input type="text" id="profession_pere"></div></div>
        </div>
        <div class="row">
            <div class="col"><div class="form-group"><label>Nom de la Mère :</label><input type="text" id="mere"></div></div>
            <div class="col"><div class="form-group"><label>Profession de la Mère :</label><input type="text" id="profession_mere"></div></div>
        </div>
        <div class="row">
            <div class="col"><div class="form-group"><label>Téléphone du Responsable :</label><input type="text" id="telephone_responsable" required></div></div>
            <div class="col"><div class="form-group"><label>Nom du Responsable :</label><input type="text" id="nom_responsable"></div></div>
        </div>

        <button type="submit">Valider l'Inscription en Ligne</button>
    </form>
    
</div>

<script>
    document.getElementById('formInscription').addEventListener('submit', async function(e) {
        e.preventDefault();

        const data = {
            nom: document.getElementById('nom').value,
            postnom: document.getElementById('postnom').value,
            prenom: document.getElementById('prenom').value,
            cycle: document.getElementById('cycle').value,
            classe: document.getElementById('classe').value,
            genre: document.getElementById('genre').value,
            date_naissance: document.getElementById('date_naissance').value,
            nationalite: document.getElementById('nationalite').value,
            province: document.getElementById('province').value,
            commune: document.getElementById('commune').value,
            quartier: document.getElementById('quartier').value,
            adresse_physique: document.getElementById('adresse_physique').value,
            email: document.getElementById('email').value,
            pere: document.getElementById('pere').value,
            profession_pere: document.getElementById('profession_pere').value,
            mere: document.getElementById('mere').value,
            profession_mere: document.getElementById('profession_mere').value,
            telephone_responsable: document.getElementById('telephone_responsable').value,
            nom_responsable: document.getElementById('nom_responsable').value
        };

        try {
            const response = await fetch('http://localhost:3000/api/inscriptions-ligne', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            const result = await response.json();
            if (result.success) {
                alert("Inscription réussie ! Veuillez vous présenter à l'école pour la confirmation.");
                document.getElementById('formInscription').reset();
            } else {
                alert("Erreur : " + result.error);
            }
        } catch (err) {
            alert("Erreur de connexion au serveur.");
            console.error(err);
        }
    });
</script>

</body>
</html>
