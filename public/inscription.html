<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription en Ligne - CS Jobec</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #cbd5e1;
            --success: #16a34a;
            --error: #dc2626;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f8fafc 0%, var(--bg-color) 100%);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
            box-sizing: border-box;
        }

        .container {
            max-width: 850px;
            background: var(--card-bg);
            padding: 40px;
            margin: auto;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.08);
        }

        .back-link {
            display: inline-block;
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 20px;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: var(--primary-hover);
            text-decoration: underline;
        }

        h2 {
            color: var(--text-main);
            text-align: center;
            margin-top: 0;
            margin-bottom: 30px;
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.025em;
        }

        h3 {
            color: var(--primary);
            font-size: 18px;
            margin-top: 30px;
            margin-bottom: 15px;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 8px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 14px;
            color: #475569;
        }

        input, select {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            font-size: 14px;
            background-color: #f8fafc;
            box-sizing: border-box;
            transition: all 0.2s ease;
            outline: none;
        }

        input:focus, select:focus {
            border-color: var(--primary);
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
        }

        .row {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .col {
            flex: 1;
            min-width: 220px;
        }

        button {
            background-color: var(--success);
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 16px;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            font-weight: 600;
            box-shadow: 0 4px 6px -1px rgba(22, 163, 74, 0.2);
            transition: all 0.2s ease;
            margin-top: 20px;
        }

        button:hover {
            background-color: #15803d;
            transform: translateY(-1px);
            box-shadow: 0 6px 8px -1px rgba(22, 163, 74, 0.3);
        }

        button:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>

<div class="container">
    <a href="index.html" class="back-link">← Retour au site officiel</a>
    <h2>Formulaire d'Inscription en Ligne - CS Jobec</h2>
    
    <form id="formInscription">
        <h3>Informations de l'Élève</h3>
        <div class="row">
            <div class="col"><div class="form-group"><label>Nom :</label><input type="text" id="nom" required placeholder="Ex: Kabuya"></div></div>
            <div class="col"><div class="form-group"><label>Post-nom :</label><input type="text" id="postnom" placeholder="Ex: Tshisekedi"></div></div>
            <div class="col"><div class="form-group"><label>Prénom :</label><input type="text" id="prenom" required placeholder="Ex: David"></div></div>
        </div>

        <div class="row">
            <div class="col">
                <div class="form-group">
                    <label>Cycle :</label>
                    <select id="cycle">
                        <option value="Maternel">Maternel</option>
                        <option value="Primaire">Primaire</option>
                        <option value="Humanités">Humanités</option>
                    </select>
                </div>
            </div>
            <div class="col"><div class="form-group"><label>Classe :</label><input type="text" id="classe" placeholder="ex: 3EME"></div></div>
            <div class="col">
                <div class="form-group">
                    <label>Genre :</label>
                    <select id="genre">
                        <option value="M">Masculin</option>
                        <option value="F">Féminin</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col"><div class="form-group"><label>Date de Naissance :</label><input type="date" id="date_naissance"></div></div>
            <div class="col"><div class="form-group"><label>Nationalité :</label><input type="text" id="nationalite" value="Congolaise"></div></div>
        </div>

        <h3>Coordonnées & Adresse</h3>
        <div class="row">
            <div class="col"><div class="form-group"><label>Province :</label><input type="text" id="province" value="Kinshasa"></div></div>
            <div class="col"><div class="form-group"><label>Commune :</label><input type="text" id="commune" placeholder="Ex: N'Djili"></div></div>
            <div class="col"><div class="form-group"><label>Quartier :</label><input type="text" id="quartier" placeholder="Ex: 7ème Rue"></div></div>
        </div>
        <div class="form-group"><label>Adresse Physique :</label><input type="text" id="adresse_physique" placeholder="Ex: Avenue Kasa-Vubu N°12"></div>
        <div class="form-group"><label>Email :</label><input type="email" id="email" placeholder="Ex: contact@exemple.com"></div>

        <h3>Parents & Responsables</h3>
        <div class="row">
            <div class="col"><div class="form-group"><label>Nom du Père :</label><input type="text" id="pere"></div></div>
            <div class="col"><div class="form-group"><label>Profession du Père :</label><input type="text" id="profession_pere"></div></div>
        </div>
        <div class="row">
            <div class="col"><div class="form-group"><label>Nom de la Mère :</label><input type="text" id="mere"></div></div>
            <div class="col"><div class="form-group"><label>Profession de la Mère :</label><input type="text" id="profession_mere"></div></div>
        </div>
        <div class="row">
            <div class="col"><div class="form-group"><label>Téléphone du Responsable :</label><input type="text" id="telephone_responsable" required placeholder="Ex: +243..."></div></div>
            <div class="col"><div class="form-group"><label>Nom du Responsable :</label><input type="text" id="nom_responsable"></div></div>
        </div>

        <button type="submit">Valider l'Inscription en Ligne</button>
    </form>
</div>

<script>
    document.getElementById('formInscription').addEventListener('submit', async function(e) {
        e.preventDefault();

        const data = {
            nom: document.getElementById('nom').value,
            postnom: document.getElementById('postnom').value,
            prenom: document.getElementById('prenom').value,
            cycle: document.getElementById('cycle').value,
            classe: document.getElementById('classe').value,
            genre: document.getElementById('genre').value,
            date_naissance: document.getElementById('date_naissance').value,
            nationalite: document.getElementById('nationalite').value,
            province: document.getElementById('province').value,
            commune: document.getElementById('commune').value,
            quartier: document.getElementById('quartier').value,
            adresse_physique: document.getElementById('adresse_physique').value,
            email: document.getElementById('email').value,
            pere: document.getElementById('pere').value,
            profession_pere: document.getElementById('profession_pere').value,
            mere: document.getElementById('mere').value,
            profession_mere: document.getElementById('profession_mere').value,
            telephone_responsable: document.getElementById('telephone_responsable').value,
            nom_responsable: document.getElementById('nom_responsable').value
        };

        try {
            // Utilisation d'une URL relative pour fonctionner à la fois en local et en ligne sur Render
            const response = await fetch('/api/inscriptions-ligne', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            const result = await response.json();
            if (response.ok && result.success) {
                alert("Inscription réussie ! Veuillez vous présenter à l'école pour la confirmation.");
                document.getElementById('formInscription').reset();
            } else {
                alert("Erreur : " + (result.error || "Impossible d'enregistrer l'inscription."));
            }
        } catch (err) {
            alert("Erreur de connexion au serveur.");
            console.error(err);
        }
    });
</script>

</body>
</html>
