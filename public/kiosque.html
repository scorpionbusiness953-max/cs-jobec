<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiosque de Pointage - École</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3a8a, #3b82f6);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #333;
        }
        .kiosque-container {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 480px;
            text-align: center;
        }
        h1 { color: #1e3a8a; margin-bottom: 5px; font-size: 1.6em; }
        .clock { font-size: 1.1em; color: #64748b; margin-bottom: 20px; font-weight: bold; }
        .btn-profile {
            width: 100%;
            padding: 16px;
            font-size: 1.1em;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin: 10px 0;
            transition: transform 0.1s, background 0.2s;
        }
        .btn-profile:active { transform: scale(0.98); }
        .btn-eleve { background-color: #10b981; color: white; }
        .btn-eleve:hover { background-color: #059669; }
        .btn-personnel { background-color: #6366f1; color: white; }
        .btn-personnel:hover { background-color: #4f46e5; }

        .input-section { margin-top: 15px; }
        
        /* Style pour la webcam */
        .webcam-box {
            width: 100%;
            height: 200px;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 15px;
            display: none;
            position: relative;
        }
        video { width: 100%; height: 100%; object-fit: cover; }

        input[type="text"] {
            width: 100%;
            padding: 14px;
            font-size: 1.1em;
            border: 2px solid #cbd5e1;
            border-radius: 8px;
            box-sizing: border-box;
            text-align: center;
            margin-bottom: 15px;
        }
        input[type="text"]:focus { border-color: #3b82f6; outline: none; }
        
        .btn-valider {
            background-color: #2563eb;
            color: white;
            width: 100%;
            padding: 14px;
            font-size: 1.1em;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-valider:hover { background-color: #1d4ed8; }
        
        .btn-retour {
            background: none;
            border: none;
            color: #64748b;
            cursor: pointer;
            margin-top: 15px;
            font-size: 1em;
            text-decoration: underline;
        }
        .hidden { display: none; }
        
        .message-box {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            font-size: 1em;
            font-weight: bold;
        }
        .success { background-color: #d1fae5; color: #065f46; }
        .error { background-color: #fee2e2; color: #991b1b; }
    </style>
</head>
<body>

<div class="kiosque-container">
    <h1>🏫 Pointage École</h1>
    <div class="clock" id="liveClock">--:--:--</div>

    <!-- ÉTAPE 1 : Choix du profil -->
    <div id="stepSelection">
        <p style="margin-bottom: 15px; color: #475569;">Veuillez sélectionner votre profil :</p>
        <button class="btn-profile btn-eleve" onclick="choisirProfil('eleve')">👨‍🎓 Je suis un Élève</button>
        <button class="btn-profile btn-personnel" onclick="choisirProfil('personnel')">👩‍🏫 Je suis un Membre du Personnel</button>
    </div>

    <!-- ÉTAPE 2 : Saisie -->
    <div id="stepInput" class="input-section hidden">
        <h3 id="inputTitle" style="color: #334155; margin-bottom: 10px;"></h3>
        
        <!-- Boîte vidéo pour la webcam (visible uniquement pour le personnel) -->
        <div id="webcamContainer" class="webcam-box hidden">
            <video id="videoElement" autoplay playsinline></video>
        </div>
        <canvas id="canvasElement" class="hidden"></canvas>

        <input type="text" id="idInput" placeholder="" autocomplete="off">
        <button class="btn-valider" onclick="validerPointage()">Valider</button>
        <br>
        <button class="btn-retour" onclick="revenirAccueil()">← Retour</button>
    </div>

    <!-- Message de retour -->
    <div id="messageBox" class="message-box hidden"></div>
</div>

<script>
    let profilActif = '';
    let mediaStream = null;

    // Horloge en direct
    setInterval(() => {
        const now = new Date();
        document.getElementById('liveClock').innerText = now.toLocaleTimeString('fr-FR');
    }, 1000);

    // Choisir le profil
    async function choisirProfil(profil) {
        profilActif = profil;
        document.getElementById('stepSelection').classList.add('hidden');
        document.getElementById('stepInput').classList.remove('hidden');
        document.getElementById('messageBox').classList.add('hidden');
        document.getElementById('idInput').value = '';

        const titreInput = document.getElementById('inputTitle');
        const champInput = document.getElementById('idInput');
        const webcamContainer = document.getElementById('webcamContainer');

        if (profil === 'eleve') {
            titreInput.innerText = "Pointage Élève";
            champInput.placeholder = "Entrez votre matricule...";
            webcamContainer.classList.add('hidden');
            arreterWebcam();
        } else {
            titreInput.innerText = "Pointage Personnel (Arrivée / Départ)";
            champInput.placeholder = "Entrez votre numéro de téléphone...";
            webcamContainer.classList.remove('hidden');
            await demarrerWebcam();
        }
        champInput.focus();
    }

    // Activer la webcam
    async function demarrerWebcam() {
        try {
            mediaStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
            document.getElementById('videoElement').srcObject = mediaStream;
        } catch (err) {
            console.error("Erreur d'accès à la webcam :", err);
            alert("Impossible d'activer la webcam. Vérifiez les permissions.");
        }
    }

    // Arrêter la webcam pour libérer la caméra
    function arreterWebcam() {
        if (mediaStream) {
            mediaStream.getTracks().forEach(track => track.stop());
            mediaStream = null;
        }
    }

    // Revenir à l'accueil
    function revenirAccueil() {
        arreterWebcam();
        profilActif = '';
        document.getElementById('stepInput').classList.add('hidden');
        document.getElementById('stepSelection').classList.remove('hidden');
        document.getElementById('messageBox').classList.add('hidden');
        document.getElementById('idInput').value = '';
    }

    // Validation du pointage
    async function validerPointage() {
        const valeurSaisie = document.getElementById('idInput').value.trim();
        const msgBox = document.getElementById('messageBox');

        if (!valeurSaisie) {
            msgBox.className = "message-box error";
            msgBox.innerText = "Veuillez remplir le champ requis.";
            msgBox.classList.remove('hidden');
            return;
        }

        let photoData = null;
        if (profilActif === 'personnel') {
            // Capturer l'image de la webcam sur un canvas
            const video = document.getElementById('videoElement');
            const canvas = document.getElementById('canvasElement');
            canvas.width = video.videoWidth || 320;
            canvas.height = video.videoHeight || 240;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            photoData = canvas.toDataURL('image/jpeg'); // Format Base64 de la photo
        }

        try {
            let endpoint = profilActif === 'eleve' ? '/api/pointage' : '/api/pointer/personnel';
            let payload = profilActif === 'eleve' 
                ? { type: 'eleve', identifiant: valeurSaisie }
                : { telephone: valeurSaisie, photo: photoData };

            const response = await fetch(endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const result = await response.json();

            if (response.ok && result.success) {
                msgBox.className = "message-box success";
                
                if (profilActif === 'personnel') {
                    msgBox.innerText = `✅ ${result.action} enregistrée pour ${result.nom} (${result.fonction}) à ${result.heure}`;
                } else {
                    msgBox.innerText = `✅ Bienvenue ${result.nomEleve} ! Présence enregistrée à ${result.heure}.`;
                }
                
                msgBox.classList.remove('hidden');

                setTimeout(() => {
                    revenirAccueil();
                }, 4000);
            } else {
                throw new Error(result.message || "Erreur lors du traitement.");
            }
        } catch (error) {
            msgBox.className = "message-box error";
            msgBox.innerText = "❌ " + (error.message || "Erreur de connexion au serveur.");
            msgBox.classList.remove('hidden');
        }
    }
</script>

</body>
</html>
