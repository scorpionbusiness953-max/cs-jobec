<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Espace Parent - Suivi des Frais</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background-color: #f4f7f6; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); max-width: 400px; margin-top: 20px; display: none; }
        .error { color: red; font-weight: bold; margin-top: 20px; display: none; }
        button { padding: 10px 15px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        input { padding: 10px; width: 200px; border: 1px solid #ccc; border-radius: 4px; }
    </style>
</head>
<body>

    <h2>Recherche des frais de l'élève</h2>
    <input type="text" id="matriculeInput" placeholder="Entrez le matricule (ex: 6)">
    <button onclick="rechercherEleve()">Rechercher</button>

    <div id="errorBox" class="error"></div>

    <div id="resultCard" class="card">
        <h3>Informations de l'élève</h3>
        <p><strong>Nom Complet :</strong> <span id="lblNom"></span></p>
        <p><strong>Classe :</strong> <span id="lblClasse"></span></p>
        <p><strong>Total des Frais Payés :</strong> <span id="lblPaye"></span> USD</p>
    </div>

    <script>
        async function rechercherEleve() {
            const matricule = document.getElementById('matriculeInput').value;
            const errorBox = document.getElementById('errorBox');
            const resultCard = document.getElementById('resultCard');

            // Masquer les anciens résultats
            errorBox.style.display = 'none';
            resultCard.style.display = 'none';

            if (!matricule) {
                errorBox.innerText = "Veuillez entrer un numéro de matricule.";
                errorBox.style.display = 'block';
                return;
            }

            try {
                // Appel à ton API C# qui tourne sur le port 5264
                const response = await fetch(`http://localhost:5264/api/eleve/${matricule}`);
                
                if (!response.ok) {
                    throw new Error("Élève non trouvé ou erreur serveur.");
                }

                const data = await response.json();

                // Remplir l'interface avec les données du JSON
                document.getElementById('lblNom').innerText = data.nom;
                document.getElementById('lblClasse').innerText = data.classe || "Non spécifiée";
                document.getElementById('lblPaye').innerText = data.paye;

                // Afficher la carte
                resultCard.style.display = 'block';

            } catch (error) {
                errorBox.innerText = error.message;
                errorBox.style.display = 'block';
            }
        }
    </script>
</body>
</html>
