<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rapport des Présences - Élèves</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8fafc;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        h2 {
            color: #1e3a8a;
            margin-bottom: 20px;
        }
        .filters {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            background: #f1f5f9;
            padding: 15px;
            border-radius: 8px;
            align-items: center;
        }
        .filters label {
            font-weight: bold;
            color: #475569;
            font-size: 0.9em;
        }
        .filters input, .filters select {
            padding: 8px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 1em;
            outline: none;
        }
        .btn-imprimer {
            background-color: #10b981;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1em;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            margin-left: auto;
        }
        .btn-imprimer:hover {
            background-color: #059669;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
        }
        th {
            background-color: #3b82f6;
            color: white;
            font-weight: 600;
        }
        tr:hover {
            background-color: #f8fafc;
        }
        .no-result {
            text-align: center;
            color: #64748b;
            padding: 20px;
            font-style: italic;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>📋 Rapport des Présences des Élèves</h2>

    <!-- Zone des filtres de recherche -->
    <div class="filters">
        <div>
            <label for="filtreDate">Date :</label><br>
            <input type="date" id="filtreDate" oninput="filtrerPresences()">
        </div>
        <div>
            <label for="filtreCycle">Cycle :</label><br>
            <select id="filtreCycle" onchange="filtrerPresences()">
                <option value="">Tous les cycles</option>
                <option value="Maternelle">Maternelle</option>
                <option value="Primaire">Primaire</option>
                <option value="Humanités">Humanités</option>
            </select>
        </div>
        <div>
            <label for="filtreClasse">Classe (ex: 8ème) :</label><br>
            <input type="text" id="filtreClasse" placeholder="Tapez la classe..." oninput="filtrerPresences()">
        </div>
        <div>
            <button style="background:none; border:none; color:#2563eb; cursor:pointer; text-decoration:underline; margin-top:15px;" onclick="reinitialiserFiltres()">Réinitialiser</button>
        </div>
        
        <button class="btn-imprimer" onclick="window.print()">🖨️ Imprimer</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>Matricule</th>
                <th>Nom & Postnom</th>
                <th>Cycle</th>
                <th>Classe</th>
                <th>Date</th>
                <th>Heure d'Arrivée</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            <!-- Les données injectées par JS -->
        </tbody>
    </table>
</div>

<script>
    let toutesLesPresences = [];

    async function chargerPresences() {
        try {
            const response = await fetch('/api/presences/eleves');
            const data = await response.json();

            if (data.success) {
                toutesLesPresences = data.presences;
                afficherTableau(toutesLesPresences);
            } else {
                alert("Erreur lors du chargement des présences.");
            }
        } catch (error) {
            console.error("Erreur réseau :", error);
        }
    }

    function afficherTableau(donnees) {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';

        if (donnees.length === 0) {
            tbody.innerHTML = `<tr><td colspan="6" class="no-result">Aucun enregistrement trouvé pour ces critères.</td></tr>`;
            return;
        }

        donnees.forEach(p => {
            const datePropre = p.date_jour ? p.date_jour.split('T')[0] : '';
            
            const row = `
                <tr>
                    <td>${p.matricule || ''}</td>
                    <td>${p.postnom || ''} ${p.prenom || ''}</td>
                    <td>${p.cycle || '-'}</td>
                    <td>${p.classe || '-'}</td>
                    <td>${datePropre}</td>
                    <td><strong>${p.heure_arrivee || ''}</strong></td>
                </tr>
            `;
            tbody.innerHTML += row;
        });
    }

    function filtrerPresences() {
        const dateFiltre = document.getElementById('filtreDate').value;
        const cycleFiltre = document.getElementById('filtreCycle').value.trim().toLowerCase();
        const classeFiltre = document.getElementById('filtreClasse').value.trim().toLowerCase();

        const resultatsFiltres = toutesLesPresences.filter(p => {
            const datePropre = p.date_jour ? p.date_jour.split('T')[0] : '';
            const cycleEleve = p.cycle ? p.cycle.trim().toLowerCase() : '';
            const classeEleve = p.classe ? p.classe.trim().toLowerCase() : '';

            // Filtrage par date si renseigné
            const matchDate = dateFiltre ? (datePropre === dateFiltre) : true;
            
            // Filtrage par cycle si sélectionné
            const matchCycle = cycleFiltre ? (cycleEleve === cycleFiltre) : true;
            
            // Filtrage par texte de classe (recherche partielle, ex: "8" trouvera "8eme" ou "8e")
            const matchClasse = classeFiltre ? classeEleve.includes(classeFiltre) : true;

            return matchDate && matchCycle && matchClasse;
        });

        afficherTableau(resultatsFiltres);
    }

    function reinitialiserFiltres() {
        document.getElementById('filtreDate').value = '';
        document.getElementById('filtreCycle').value = '';
        document.getElementById('filtreClasse').value = '';
        afficherTableau(toutesLesPresences);
    }

    // Charger les données au démarrage
    chargerPresences();
</script>

</body>
</html>
