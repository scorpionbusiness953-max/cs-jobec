<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion & Suivi du Personnel - CS JOBEC</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --primary-blue: #002147; --gold: #D4AF37; --dark: #1a1a1a; --success: #28a745; }
        body { font-family: 'Poppins', sans-serif; background: #f4f4f9; margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        h2 { color: var(--primary-blue); margin-bottom: 20px; text-align: center; }
        
        .filters { display: flex; gap: 15px; margin-bottom: 20px; flex-wrap: wrap; }
        .filters input, .filters select { padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 1rem; flex: 1; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: var(--primary-blue); color: white; }
        tr:hover { background-color: #f9f9f9; }
        
        .btn-detail { background: var(--gold); color: var(--dark); border: none; padding: 6px 12px; border-radius: 4px; font-weight: bold; cursor: pointer; }
        .btn-detail:hover { opacity: 0.8; }

        /* Style de la modale pour les détails */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 30px; border-radius: 8px; width: 90%; max-width: 600px; max-height: 80vh; overflow-y: auto; }
        .close-btn { float: right; font-size: 1.5rem; font-weight: bold; cursor: pointer; color: #ff0000; }
    </style>
</head>
<body>

<div class="container">
    <h2>📋 Suivi et Présences du Personnel - CS JOBEC</h2>
    
    <!-- Filtres de recherche et de date -->
    <div class="filters">
        <input type="text" id="searchNom" placeholder="Rechercher par nom ou fonction..." onkeyup="filtrerPersonnel()">
        <input type="date" id="filtreDate" onchange="filtrerPersonnel()">
    </div>

    <table>
        <thead>
            <tr>
                <th>Nom & Prénom</th>
                <th>Fonction</th>
                <th>Téléphone</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="tableauPersonnel">
            <!-- Chargé dynamiquement -->
        </tbody>
    </table>
</div>

<!-- Fenêtre Modale pour voir les détails et statistiques -->
<div id="modalDetails" class="modal">
    <div class="modal-content">
        <span class="close-btn" onclick="fermerModal()">&times;</span>
        <h3 id="modalNomAgent">Détails de l'agent</h3>
        <p><strong>Fonction :</strong> <span id="modalFonction"></span></p>
        <p><strong>Jours de présence enregistrés :</strong> <span id="modalTotalPresences" style="color: green; font-weight: bold;">0</span></p>
        
        <h4>Historique des pointages :</h4>
        <table>
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Arrivée (H.A)</th>
                    <th>Départ (H.D)</th>
                </tr>
            </thead>
            <tbody id="modalTableauHistorique">
                <!-- Historique de l'agent -->
            </tbody>
        </table>
    </div>
</div>

<script>
    let listePersonnelsGlobale = [];

    async function chargerPersonnel() {
        try {
            const response = await fetch('/api/personnels');
            const data = await response.json();
            listePersonnelsGlobale = data;
            afficherTableau(data);
        } catch (err) {
            console.error("Erreur chargement personnel:", err);
        }
    }

    function afficherTableau(personnels) {
        const tbody = document.getElementById('tableauPersonnel');
        tbody.innerHTML = '';

        if (personnels.length === 0) {
            tbody.innerHTML = `<tr><td colspan="4" style="text-align: center; color: #666;">Aucun personnel trouvé.</td></tr>`;
            return;
        }

        personnels.forEach(p => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${p.nom || ''} ${p.prenom || ''}</td>
                <td>${p.fonction || ''}</td>
                <td>${p.telephone || ''}</td>
                <td><button class="btn-detail" onclick="ouvrirDetails(${p.id})">Détail</button></td>
            `;
            tbody.appendChild(tr);
        });
    }

    function filtrerPersonnel() {
        const texte = document.getElementById('searchNom').value.toLowerCase();
        const resultatFiltre = listePersonnelsGlobale.filter(p => 
            (`${p.nom} ${p.prenom} ${p.fonction}`).toLowerCase().includes(texte)
        );
        afficherTableau(resultatFiltre);
    }

    async function ouvrirDetails(id) {
        try {
            const response = await fetch(`/api/admin/personnel/details/${id}`);
            const result = await response.json();

            if (result.success) {
                document.getElementById('modalNomAgent').innerText = `${result.personnel.nom} ${result.personnel.prenom}`;
                document.getElementById('modalFonction').innerText = result.personnel.fonction;
                document.getElementById('modalTotalPresences').innerText = result.total_jours_presents;

                const tbodyHist = document.getElementById('modalTableauHistorique');
                tbodyHist.innerHTML = '';

                if (result.presences.length === 0) {
                    tbodyHist.innerHTML = `<tr><td colspan="3" style="text-align: center;">Aucun pointage trouvé.</td></tr>`;
                } else {
                    result.presences.forEach(pr => {
                        tbodyHist.innerHTML += `
                            <tr>
                                <td>${new Date(pr.date_jour).toLocaleDateString('fr-FR')}</td>
                                <td><span style="color: green; font-weight: bold;">${pr.heure_arrivee || '--:--'}</span></td>
                                <td><span style="color: red; font-weight: bold;">${pr.heure_depart || 'En service'}</span></td>
                            </tr>
                        `;
                    });
                }

                document.getElementById('modalDetails').style.display = 'flex';
            }
        } catch (err) {
            console.error("Erreur lors de la récupération des détails :", err);
        }
    }

    function fermerModal() {
        document.getElementById('modalDetails').style.display = 'none';
    }

    // Charger la liste au démarrage
    chargerPersonnel();
</script>

</body>
</html>
