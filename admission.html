<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jobec - Demande d'Admission</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #061e38;
            color: #ffffff;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .admission-container {
            background-color: #010a15;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 550px;
            padding: 40px;
            box-sizing: border-box;
            text-align: center;
            margin: 20px;
        }
        h2 { margin-top: 0; font-size: 28px; color: #ffffff; margin-bottom: 10px; }
        p.subtitle { color: #b0c4de; font-size: 14px; margin-bottom: 30px; }
        .form-group { text-align: left; margin-bottom: 20px; }
        label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px; }
        input[type="text"], input[type="email"], select {
            width: 100%; padding: 12px; background-color: transparent;
            border: 2px solid #3a4f66; border-radius: 6px; color: #ffffff;
            font-size: 15px; box-sizing: border-box; transition: border-color 0.3s ease;
        }
        input:focus, select:focus { outline: none; border-color: #00bcd4; }
        select option { background-color: #010a15; color: #ffffff; }
        button {
            width: 100%; padding: 14px; background-color: transparent; border: 2px solid #ffffff;
            border-radius: 6px; color: #ffffff; font-size: 16px; font-weight: bold;
            cursor: pointer; transition: all 0.3s ease; margin-top: 10px;
        }
        button:hover { background-color: #ffffff; color: #010a15; }
        button:disabled { border-color: #555; color: #555; cursor: not-allowed; }
        .back-link { display: inline-block; margin-top: 20px; color: #ffd700; text-decoration: none; font-size: 14px; }
        .back-link:hover { text-decoration: underline; }
        #admissionStatus { margin-top: 15px; font-weight: bold; font-size: 14px; }
    </style>
</head>
<body>

<div class="admission-container">
    <h2>Demande d'Admission</h2>
    <p class="subtitle">Inscrivez votre enfant en remplissant le formulaire ci-dessous.</p>

    <form id="admissionForm">
        <div class="form-group">
            <label melon="nomEnfant">Nom de l'enfant</label>
            <input type="text" id="nomEnfant" required placeholder="Nom de l'élève">
        </div>
        
        <div class="form-group">
            <label for="prenomEnfant">Prénom de l'enfant</label>
            <input type="text" id="prenomEnfant" required placeholder="Prénom de l'élève">
        </div>

        <div class="form-group">
            <label for="classeSouhaitee">Classe souhaitée</label>
            <select id="classeSouhaitee" required>
                <option value="">-- Choisir une classe --</option>
                <option value="7eme Primaire">7ème Nouvelle Básique</option>
                <option value="8eme Primaire">8ème Nouvelle Básique</option>
                <option value="1ere Humanite">1ère Humanité</option>
                <option value="2eme Humanite">2ème Humanité</option>
            </select>
        </div>
        
        <div class="form-group">
            <label for="nomParent">Nom du parent / tuteur</label>
            <input type="text" id="nomParent" required placeholder="Votre nom complet">
        </div>
        
        <div class="form-group">
            <label for="telephoneParent">Numéro de Téléphone</label>
            <input type="text" id="telephoneParent" required placeholder="Ex: +243...">
        </div>

        <div class="form-group">
            <label for="emailParent">Adresse Email du parent</label>
            <input type="email" id="emailParent" placeholder="Votre adresse email (optionnel)">
        </div>
        
        <button type="submit" id="btnAdmission">Soumettre l'inscription</button>
    </form>

    <div id="admissionStatus"></div>

    <a href="index.html" class="back-link">← Retour au site officiel</a>
</div>

<script>
document.getElementById('admissionForm').addEventListener('submit', async function(e) {
    e.preventDefault();

    const btn = document.getElementById('btnAdmission');
    const statusDiv = document.getElementById('admissionStatus');
    
    btn.innerText = "Traitement en cours...";
    btn.disabled = true;
    statusDiv.innerText = "";

    // ATTENTION AUX MAJUSCULES ICI : Elles matchent ton modèle C#
    const data = {
        nomEnfant: document.getElementById('nomEnfant').value,
        prenomEnfant: document.getElementById('prenomEnfant').value,
        classeSouhaitee: document.getElementById('classeSouhaitee').value,
        nomParent: document.getElementById('nomParent').value,
        telephoneParent: document.getElementById('telephoneParent').value,
        emailParent: document.getElementById('emailParent').value
    };

    try {
        const response = await fetch('https://jobec-api.onrender.com/api/admission', {
            method: 'POST',
            headers: { 
                'Content-Type': 'application/json',
                'Accept': 'application/json'
            },
            body: JSON.stringify(data)
        });

        const result = await response.json();

        if (response.ok) {
            statusDiv.style.color = "#4caf50";
            statusDiv.innerText = result.message || "Demande enregistrée !";
            document.getElementById('admissionForm').reset();
        } else {
            statusDiv.style.color = "#f44336";
            statusDiv.innerText = result.message || "Erreur lors de la validation du dossier.";
        }
    } catch (error) {
        statusDiv.style.color = "#ff9800";
        statusDiv.innerText = "Impossible de joindre le service d'admission. Réessayez.";
        console.error("Détail de l'erreur:", error);
    } finally {
        btn.innerText = "Soumettre l'inscription";
        btn.disabled = false;
    }
});
</script>

</body>
</html>
